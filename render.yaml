services:
  - type: web
    name: contact-form-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --reuse-port --workers=2 --timeout=120 --keep-alive=5 --max-requests=1000 --log-level=info main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: FLASK_ENV
        value: production
      - key: PYTHONUNBUFFERED
        value: "true"
      - key: SQLALCHEMY_POOL_SIZE
        value: "5"
      - key: SQLALCHEMY_MAX_OVERFLOW
        value: "10"
      - key: SQLALCHEMY_POOL_TIMEOUT
        value: "30"
      - key: SQLALCHEMY_POOL_RECYCLE
        value: "300"
      - key: DB_MAX_RETRIES
        value: "5"
      - key: DB_RETRY_DELAY
        value: "0.5"
      - key: SSL_MODE
        value: "require"
      - key: DATABASE_URL
        fromDatabase:
          name: contact-db
          property: connectionString
      - key: PGHOST
        fromDatabase:
          name: contact-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: contact-db
          property: port
      - key: PGUSER
        fromDatabase:
          name: contact-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: contact-db
          property: password
      - key: PGDATABASE
        fromDatabase:
          name: contact-db
          property: database
      - key: SESSION_SECRET
        generateValue: true
    healthCheckPath: /api/v1/health

databases:
  - name: contact-db
    databaseName: contact_uni6
    user: contact_uni6_user
    plan: free
